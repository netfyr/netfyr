default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: spec-ref
        name: change declaration trailer
        entry: scripts/check-spec-ref.sh --msg
        language: system
        stages: [commit-msg]

      - id: spec-approved
        name: merged spec references
        entry: scripts/check-spec-ref.sh --push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
